<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KisanExpress</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div><h1>🚜 KisanExpress</h1><small id="tag"></small></div>
  <select id="lang" aria-label="Language">
    <option value="en">English</option>
    <option value="te">తెలుగు</option>
  </select>
</header>
<nav id="roles">
  <button data-r="farmer"></button>
  <button data-r="shop"></button>
  <button data-r="driver"></button>
</nav>
<main id="app"></main>
<footer><button id="reset"></button></footer>
<div id="toast" role="status"></div>
<script>
window.__errs = [];
function showErr(extra) {
  var a = document.getElementById('app');
  if (!a) return;
  a.innerHTML = '<div style="padding:16px;color:#b3402a;font-weight:700">' + (extra || '') +
    window.__errs.map(function (e) { return 'Error: ' + e; }).join('<br>') +
    '<br><small>Please send a screenshot of this to Claude.</small></div>';
}
window.onerror = function (m, u, l) { window.__errs.push(m + ' (line ' + l + ')'); showErr(); };
</script>
<script src="data.js"></script>
<script src="address.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var need = [['data.js', typeof TX], ['address.js', typeof addrCard], ['app.js', typeof R]];
  var bad = need.filter(function (n) { return n[1] === 'undefined'; }).map(function (n) { return n[0]; });
  if (bad.length) showErr('Missing or broken file: ' + bad.join(', ') + '<br>');
})();
</script>
</body>
</html>
